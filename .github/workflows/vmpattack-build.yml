name: Build VMPAttack (Official Native Build)

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    # استفاده از اکشن رسمی مایکروسافت برای اجرای بیلد بدون ابزارهای واسطه
    - name: Run CMake Config & Build
      uses: threeal/cmake-action@v1.3.0
      with:
        source-dir: .
        build-dir: build
        config-type: Release
        options: |
          CMAKE_CXX_STANDARD=20
          CMAKE_CXX_STANDARD_REQUIRED=ON

    - name: Upload Finished EXE
      uses: actions/upload-artifact@v4
      with:
        name: VMPAttack-Windows-EXE
        path: |
          build/Release/*.exe
          build/VMPAttack/Release/*.exe
          build/**/*.exe
