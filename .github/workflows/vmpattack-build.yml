name: Build VMPAttack (The Ultimate Patch)

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    # پچ کردن مستقیم کدهای مخرب خط 665 با ساختار سنتی و بدون ارور
    # این دستور تیکه کد مشکل‌دار را به یک حلقه کلاسیک و سازگار تبدیل می‌کند
    - name: Patch Syntax Error in vmpattack.cpp
      shell: powershell
      run: |
        $filePath = "VMPAttack/vmpattack.cpp"
        $content = Get-Content $filePath
        # جایگزینی حلقه پیشرفته با حلقه کلاسیک جفت کلید/مقدار دات‌نت و سی‌پلاس‌پلاس
        $oldLine = 'for ( auto& [ rva, job ] : result )'
        $newLine = 'for ( auto& pair : result ) { auto& rva = pair.first; auto& job = pair.second;'
        
        # اعمال پچ و بستن کروشه اضافه در انتهای منطق حلقه
        $content = $content -replace [regex]::Escape($oldLine), $newLine
        $content | Set-Content $filePath
        Write-Host "Successfully patched line 665 syntax!"

    - name: Configure CMake Direct
      shell: cmd
      run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

    - name: Build Project Direct
      shell: cmd
      run: cmake --build build --config Release

    - name: Upload Finished EXE
      uses: actions/upload-artifact@v4
      with:
        name: VMPAttack-Windows-EXE
        path: |
          build/Release/*.exe
          build/VMPAttack/Release/*.exe
          build/**/*.exe
