name: Build VMPAttack (Direct Solution Build)

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022 # استفاده از ویندوز ۲۰۲۲ که ویژوال استودیو ۲۰۲۲ را به صورت پیش‌فرض دارد

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: nuget/setup-nuget@v2

    # نصب سریع پیش‌نیازها از طریق نیوگت (بدون اتلاف وقت و بدون نیاز به کامپایل سورس کتابخانه‌ها)
    - name: Install Capstone and Keystone via NuGet
      run: |
        nuget install capstone -Version 4.0.2 -OutputDirectory packages
        nuget install keystone -Version 0.9.2 -OutputDirectory packages

    # کامپایل مستقیم فایل پروژه ویژوال استودیو با استاندارد اجباری C++20
    - name: Build Solution directly with MSBuild
      run: |
        msbuild VMPAttack.sln /p:Configuration=Release /p:Platform=x64 /p:AdditionalOptions="/std:c++20"

    - name: Upload Finished EXE
      uses: actions/upload-artifact@v4
      with:
        name: VMPAttack-Windows-EXE
        path: |
          **/Release/*.exe
          **/*.exe
