name: Build VMPAttack (Direct Command Line)

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Configure CMake Direct
      shell: cmd
      run: cmake -B build -S . -DCMAKE_CXX_STANDARD=20 -DCMAKE_CXX_STANDARD_REQUIRED=ON

    - name: Build Project Direct
      shell: cmd
      run: cmake --build build --config Release

    - name: Upload Finished EXE
      uses: actions/upload-artifact@v4
      with:
        name: VMPAttack-Windows-EXE
        path: |
          build/Release/*.exe
          build/VMPAttack/Release/*.exe
          build/**/*.exe
