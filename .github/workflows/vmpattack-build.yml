name: Build VMPAttack EXE

on:
  workflow_dispatch: # به شما اجازه می‌دهد هر زمان خواستید دستی بیلد را شروع کنید

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive # اگر پروژه ساب‌ماژول گیت داشته باشد دانلود می‌شود

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release

    - name: Build Project
      run: cmake --build build --config Release

    - name: Upload VMPAttack EXE
      uses: actions/upload-artifact@v4
      with:
        name: VMPAttack-Windows-EXE
        path: |
          build/Release/*.exe
          build/*.exe
