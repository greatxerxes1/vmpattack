name: Build VMPAttack (Pure MSBuild & Native Libs)

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    # دانلود مستقیم و نیتیو کتابخانه‌های پیش‌نیاز بدون نیاز به مدیر پکیج‌ها
    - name: Download and Setup Keystone and Capstone
      shell: powershell
      run: |
        # ساخت پوشه برای کتابخانه‌ها
        New-Item -ItemType Directory -Force -Path ".\deps"
        
        # دانلود نسخه پیش‌کامپایل شده Capstone
        Invoke-WebRequest -Uri "https://github.com" -OutFile "capstone.zip"
        Expand-Archive -Path "capstone.zip" -DestinationPath ".\deps\capstone"
        
        # دانلود نسخه پیش‌کامپایل شده Keystone
        Invoke-WebRequest -Uri "https://github.com" -OutFile "keystone.zip"
        Expand-Archive -Path "keystone.zip" -DestinationPath ".\deps\keystone"

    # کامپایل مستقیم فایل راهکار با تزریق مسیرهای کتابخانه‌های دانلود شده و اجبار به C++20
    - name: Compile Solution
      run: |
        msbuild VMPAttack.sln /p:Configuration=Release /p:Platform=x64 `
          /p:AdditionalIncludeDirectories="${{ github.workspace }}\deps\capstone\include;${{ github.workspace }}\deps\keystone\include" `
          /p:AdditionalLibraryDirectories="${{ github.workspace }}\deps\capstone;${{ github.workspace }}\deps\keystone" `
          /p:LanguageStandard=stdcpp20 `
          /p:ConformanceMode=true

    - name: Upload Finished EXE
      uses: actions/upload-artifact@v4
      with:
        name: VMPAttack-Windows-EXE
        path: |
          **/Release/*.exe
          **/*.exe
