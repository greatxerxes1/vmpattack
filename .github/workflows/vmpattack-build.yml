name: CMake Windows Build

on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) }}
    runs-on: windows-2022

    env:
      BUILD_TYPE: Release
      BUILD_PARALLEL: 2
      # Instruct vcpkg to use GitHub Actions caching backend
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Export GitHub Actions Cache Environment (For vcpkg)
      uses: actions/github-script@v7
      with:
        script: |
          core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
          core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

    - name: Install Ninja & ccache (Windows)
      run: choco install ninja ccache -y

    - name: Setup Compiler Cache (ccache)
      uses: actions/cache@v4
      with:
        path: AppData/Local/ccache
        key: ${{ runner.os }}-ccache-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-ccache-

    - name: Enable Developer Command Prompt
      uses: ilammy/msvc-dev-cmd@v1

    - name: Install vcpkg Dependencies (Cached Automatically via GitHub Actions Backend)
      run: |
        vcpkg install capstone:x64-windows
        vcpkg install keystone:x64-windows

    - name: Configure CMake
      run: |
        cmake -S . -B build -G Ninja `
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} `
          -DVTIL_BUILD_TESTS=OFF `
          -DCMAKE_CXX_FLAGS="/wd4005 /wd4003 /wd4996 /WX-" `
          -DCMAKE_C_FLAGS="/wd4005 /wd4003 /wd4996 /WX-" `
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache `
          -DCMAKE_C_COMPILER_LAUNCHER=ccache `
          -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake `
          -DCMAKE_VERBOSE_MAKEFILE:BOOL=ON

    - name: Build
      run: |
        cmake --build build --config ${{ env.BUILD_TYPE }} --parallel ${{ env.BUILD_PARALLEL }} --verbose

    - name: Check and Collect Compiled Artifacts
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path out-artifacts
        Get-ChildItem -Path build -Filter "*.exe" -Recurse | Copy-Item -Destination out-artifacts/
        Get-ChildItem -Path build -Filter "*.dll" -Recurse | Copy-Item -Destination out-artifacts/

    - name: Upload VMPAttack EXE
      uses: actions/upload-artifact@v4
      with:
        name: vmpattack-windows-ready
        path: out-artifacts/
