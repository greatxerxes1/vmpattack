name: Build VMPAttack EXE (MSBuild Engine)

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Cache vcpkg dependencies
      uses: actions/cache@v4
      with:
        path: |
          C:/vcpkg/installed
          C:/vcpkg/downloads
        key: ${{ runner.os }}-vcpkg-${{ hashFiles('.github/workflows/build.yml') }}
        restore-keys: |
          ${{ runner.os }}-vcpkg-

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup vcpkg
      run: |
        vcpkg integrate install

    - name: Install Dependencies via vcpkg
      run: |
        vcpkg install capstone:x64-windows
        vcpkg install keystone:x64-windows

    - name: Configure CMake using VS Generator
      run: |
        cmake -B build -S . -G "Visual Studio 17 2022" -A x64 `
          -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake

    - name: Build Project with MSBuild
      run: |
        msbuild build/VMPAttack.sln /p:Configuration=Release /p:Platform=x64 /p:LanguageStandard=stdcpp20

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: VMPAttack-Windows-EXE
        path: |
          build/Release/*.exe
          build/VMPAttack/Release/*.exe
          VMPAttack/Release/*.exe
          Release/*.exe
